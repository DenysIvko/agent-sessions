name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Agent-Sessions-*
          path: dist
          merge-multiple: true
      - name: Publish versioned installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          cd dist
          sha256sum *.dmg *.exe > SHA256SUMS.txt
          cd ..
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; never replacing published assets."
            exit 0
          fi
          gh release create "$tag" dist/*.dmg dist/*.exe dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Agent Sessions $version" --notes-file docs/release-notes.md
